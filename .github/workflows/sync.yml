name: Sync app from bliss
on:
  workflow_dispatch:
  schedule:
    - cron: '10 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest app from bliss
        run: curl -fsSL https://raw.githubusercontent.com/jeongwooLee1/bliss/main/studyquest.html -o index.html
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "sync: update app from bliss"
            git push
          else
            echo "no changes"
          fi
