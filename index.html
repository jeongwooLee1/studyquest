let _enVoice=null;
function pickEnVoice(){
  try{
    const vs=window.speechSynthesis.getVoices()||[];
    const en=vs.filter(v=>/^en[-_]?/i.test(v.lang));
    if(!en.length) return null;
    const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Guy","Daniel","Karen","Moira","Alex","Google UK English"];
    for(const name of pref){ const m=en.find(v=>v.name&&v.name.indexOf(name)>=0); if(m) return m; }
    return en.find(v=>/en[-_]us/i.test(v.lang)) || en.find(v=>/en[-_]gb/i.test(v.lang)) || en[0];
  }catch(e){ return null; }
}
try{ if('speechSynthesis' in window){ _enVoice=pickEnVoice(); window.speechSynthesis.onvoiceschanged=function(){ _enVoice=pickEnVoice(); }; } }catch(e){}
function speak(text){
  try{
    if(!('speechSynthesis'in window))return;
    const u=new SpeechSynthesisUtterance(text);
    if(!_enVoice)_enVoice=pickEnVoice();
    if(_enVoice){ u.voice=_enVoice; u.lang=_enVoice.lang; } else { u.lang='en-US'; }
    u.rate=0.9;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

function bgmStart(){
  if(BGM.playing||BGM.muted)return; ensureAudio(); if(!_ac)return;
  BGM.playing=true; const tempo=0.16;
  const master=_ac.createGain(); master.gain.value=0.05; master.connect(_ac.destination); BGM.gain=master;
  function loop(){
    if(!BGM.playing)return; let t=_ac.currentTime+0.05;
    for(const m of MELODY){ const f=m[0],b=m[1]; if(f>0){const o=_ac.createOscillator();o.type='square';o.frequency.value=f;const ng=_ac.createGain();o.connect(ng);ng.connect(master);const dur=b*tempo*0.9;ng.gain.setValueAtTime(0.0001,t);ng.gain.exponentialRampToValueAtTime(0.6,t+0.01);ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);} t+=b*tempo; }
    const total=MELODY.reduce((a,m)=>a+m[1],0)*tempo;
    BGM.timer=setTimeout(loop,total*1000);
  }
  loop();
}
function bgmStop(){BGM.playing=false;if(BGM.timer){clearTimeout(BGM.timer);BGM.timer=null;}if(BGM.gain){try{BGM.gain.disconnect();}catch(e){}BGM.gain=null;}}

const DAILY_NEW_WORDS=20;
const QUESTION_SECONDS=10;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 학년별 난이도 세분화: 같은 밴드 안에서 CEFR/길이 기준으로 정렬 후, 해당 밴드의 학년 수만큼 등분하여 선택 학년 구간을 반환
const CEFR_RANK={A1:1,A2:2,B1:3,B2:4,adv:5};
function wordsForGrade(gradeId){
  const grade=GRADES.find(g=>g.id===gradeId); if(!grade) return WORDS;
  const band=grade.band;
  const subs=GRADES.filter(g=>g.band===band); const n=subs.length;
  const idx=Math.max(0,subs.findIndex(g=>g.id===gradeId));
  const pool=wordsForBand(band).slice().sort((a,b)=>{
    const r=(CEFR_RANK[a.cefr]||3)-(CEFR_RANK[b.cefr]||3); if(r)return r;
    if(a.term.length!==b.term.length)return a.term.length-b.term.length;
    return a.term<b.term?-1:(a.term>b.term?1:0);
  });
  const size=Math.ceil(pool.length/n);
  let slice=pool.slice(idx*size,(idx+1)*size);
  if(slice.length<DAILY_NEW_WORDS+6){ // 너무 적으면 인접 구간까지 확장
    slice=pool.slice(Math.max(0,idx*size-size),Math.min(pool.length,(idx+1)*size+size));
  }
  return slice.length?slice:wordsForBand(band);
}
function pickRound(pool, reviewIds, excludeIds){
  const reviews=(reviewIds||[]).map(wordById).filter(Boolean).slice(0,8).map(word=>({word,isReview:true}));
  const reviewSet=new Set(reviews.map(r=>r.word.id));
  const ex=new Set([...(reviewIds||[]),...(excludeIds||[])]);
  let fresh=shuffle(pool.filter(w=>!ex.has(w.id)));
  const needNew=Math.max(0,DAILY_NEW_WORDS-reviews.length);
  let chosen=fresh.slice(0,needNew).map(word=>({word,isReview:false}));
  let set=[...reviews,...chosen];
  if(set.length<DAILY_NEW_WORDS){
    const used=new Set(set.map(s=>s.word.id));
    const refill=shuffle(pool.filter(w=>!used.has(w.id))).slice(0,DAILY_NEW_WORDS-set.length).map(word=>({word,isReview:false}));
    set=[...set,...refill];
  }
  return set.slice(0,DAILY_NEW_WORDS);
}
// 단어의 뜻 목록 추출: MULTI에 등록됐거나, 뜻 문자열에 쉼표/세미콜론이 있으면 복수 뜻으로 간주
function senseList(word){ return MULTI[word.term]||null; } // 엄선된 다의어만 복수선택
function buildQuestion(word,pool){
  const src=(pool&&pool.length>=6)?pool:wordsForBand(word.band);
  const senses=senseList(word);
  if(senses&&senses.length>=2){
    const correct=senses.slice(0,3);
    const distractors=shuffle(wordsForBand(word.band).map(w=>w.meaning)
        .filter(m=>!/[,;]/.test(m)&&!correct.some(c=>m.includes(c)||c.includes(m)))
      ).slice(0,Math.max(2,6-correct.length));
    const options=shuffle([...correct,...distractors]);
    const correctIdx=options.map((o,i)=>correct.includes(o)?i:-1).filter(i=>i>=0);
    return {word,options,type:"multi",correctIdx,correctCount:correct.length};
  }
  const distractors=shuffle(src.filter(w=>w.id!==word.id&&w.meaning!==word.meaning).map(w=>w.meaning)).slice(0,4);
  const options=shuffle([word.meaning,...distractors]);
  return {word,options,type:"single",answerIndex:options.indexOf(word.meaning)};
}
function buildQuiz(set,pool){return set.map(s=>({...buildQuestion(s.word,pool),isReview:s.isReview}));}

    <main className="flex flex-1 flex-col justify-center gap-4 bg-slate-50 p-6">

        <h1 className="text-3xl font-extrabold">StudyQuest 🎯</h1>

        <button onClick={()=>setMode("login")} className={"flex-1 rounded-xl py-2 "+(mode==="login"?"bg-white text-brand-600 shadow":"text-slate-500")}>로그인</button>
        <button onClick={()=>setMode("signup")} className={"flex-1 rounded-xl py-2 "+(mode==="signup"?"bg-white text-brand-600 shadow":"text-slate-500")}>회원가입</button>
      </div>
      <input value={username} onChange={e=>setU(e.target.value)} placeholder="아이디 (영문/숫자 3~20자)" maxLength={20}
        className="rounded-2xl bg-white px-4 py-3 text-base ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-brand-400"/>
      <input value={password} onChange={e=>setP(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)"
        className="rounded-2xl bg-white px-4 py-3 text-base ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-brand-400"/>
      {mode==="signup"&&<input value={nickname} onChange={e=>setN(e.target.value)} placeholder="닉네임 (랭킹에 표시)" maxLength={16}
        className="rounded-2xl bg-white px-4 py-3 text-base ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-brand-400"/>}
      {mode==="signup"&&<div>
        <p className="mb-2 text-sm font-semibold text-slate-600">학년 (난이도 시작점)</p>
        <div className="grid grid-cols-5 gap-1.5">
          {GRADES.map(g=>(<button key={g.id} type="button" onClick={()=>setGrade(g.id)} className={"rounded-xl py-2 text-xs font-bold transition active:scale-95 "+(g.id===grade?"bg-brand-600 text-white shadow":"bg-white text-slate-600 ring-1 ring-slate-200")}>{g.label.replace("초등","초").replace("중학","중").replace("고등","고").replace("학년","").replace(/\s/g,"")}</button>))}
        </div>
      </div>}
      {err&&<p className="text-center text-sm font-semibold text-rose-500">{err}</p>}
      <button disabled={busy} onClick={submit} className="rounded-2xl bg-brand-600 py-4 text-base font-bold text-white transition active:scale-95 disabled:bg-slate-300">
        {busy?"처리 중…":(mode==="login"?"로그인":"가입하고 시작 →")}
      </button>
    </main>
  );
}

function Quiz({words,pool,scoreMult,bonusMult,onFinish,onExit}){
  const [questions]=useState(()=>words.map(rw=>({...buildQuestion(rw.word,pool),isReview:rw.isReview})));
  const [index,setIndex]=useState(0);
  const [selected,setSelected]=useState(null);
  const [phase,setPhase]=useState("countdown"); // countdown | answering | feedback
  const [count,setCount]=useState(3);
  const [timeLeft,setTimeLeft]=useState(QUESTION_SECONDS);
  const [points,setPoints]=useState(0);
  const [combo,setCombo]=useState(0);
  const [maxCombo,setMaxCombo]=useState(0);
  const [gain,setGain]=useState(0);
  const [fx,setFx]=useState(null);
  const [flash,setFlash]=useState(0);
  const [picked,setPicked]=useState([]);
  const wrongIds=useRef([]); const correctIds=useRef([]); const correctCount=useRef(0);
  const lock=useRef(false);
  const current=questions[index]; const total=questions.length;
  const answered=phase==="feedback"; const lastCorrect=answered&&current&&selected===current.answerIndex;

  // 시작 카운트다운 (3·2·1·GO, 실제 음성)
  useEffect(()=>{ let n=3; setCount(3); speak("three");
    const iv=setInterval(()=>{ n-=1;
      if(n>0){setCount(n);speak(n===2?"two":"one");}
      else if(n===0){setCount(0);speak("go");}
      else {clearInterval(iv);setPhase("answering");setTimeLeft(QUESTION_SECONDS);}
    },1000); return ()=>clearInterval(iv);
  },[]);
  useEffect(()=>{ if(current&&phase==="answering") speak(current.word.term); },[index,phase]);
  useEffect(()=>{
    if(phase!=="answering")return;
    if(timeLeft<=0){resolve(-1);return;}
    if(timeLeft<=3)playTick();
    const id=setTimeout(()=>setTimeLeft(s=>s-1),1000); return ()=>clearTimeout(id);
  },[timeLeft,phase]);

  function resolve(choice){
    if(lock.current||phase!=="answering")return; lock.current=true; ensureAudio();
    setSelected(choice); setPhase("feedback");
    const correct=choice===current.answerIndex;
    const elapsed=QUESTION_SECONDS-timeLeft;
    if(correct){
      correctCount.current++; correctIds.current.push(current.word.id);
      const fast=elapsed<=3;
      let c=combo;
      if(fast){c=combo+1;setCombo(c);setMaxCombo(m=>Math.max(m,c));setFlash(f=>f+1);
        if(c>=6){playCombo6();setFx({n:c,mult:"×2 포인트!! 🚀",big:true});}
        else if(c>=3){playCombo3();setFx({n:c,mult:"×1.5 보너스! 🔥",big:c===3});}
        else {playNice();setFx({n:c,mult:null,big:false});}}
      else {c=0;setCombo(0);playCorrect();setFx(null);} // 3초 초과 정답 → 콤보 리셋
      const mult=c>=6?2:c>=3?1.5:1;
      const base=current.isReview?5:3;
      const speedBonus=Math.max(0,Math.round((timeLeft/QUESTION_SECONDS)*3));
      const g=Math.max(1,Math.round((base+speedBonus)*mult*(scoreMult||1)));
      setGain(g); setPoints(p=>p+g);
      vibrate(fast?[20,30,20]:30);
    } else {
      setCombo(0); setGain(0); setFx(null);
      wrongIds.current.push(current.word.id); playWrong(); vibrate([40,50,40]);
    }
    setTimeout(next,1100);
  }
  function toggle(i){ if(phase!=="answering")return; setPicked(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]); }
  function submitMulti(){
    if(lock.current||phase!=="answering"||picked.length===0)return; lock.current=true; ensureAudio();
    setPhase("feedback");
    const need=current.correctIdx.slice().sort().join(","); const got=picked.slice().sort().join(",");
    const correct=need===got;
    if(correct){
      correctCount.current++; correctIds.current.push(current.word.id);
      const mult=combo>=6?2:combo>=3?1.5:1;
      const g=Math.max(1,Math.round((6)*mult*(scoreMult||1))); // 다의어 정답 보너스 기본 6점
      setGain(g); setPoints(p=>p+g); setFx({n:0,mult:"다의어 정답! ✨",big:false}); setFlash(f=>f+1);
      playCombo3(); vibrate([20,30,20]);
    } else {
      setCombo(0); setGain(0); setFx(null);
      wrongIds.current.push(current.word.id); playWrong(); vibrate([40,50,40]);
    }
    setTimeout(next,1300);
  }
  function next(){
    setFx(null); setPicked([]);
    if(index+1<total){setIndex(i=>i+1);setSelected(null);setGain(0);setTimeLeft(QUESTION_SECONDS);setPhase("answering");lock.current=false;}
    else finish();
  }
  function finish(){
    const perfect=wrongIds.current.length===0;
    const earned=Math.round((points+5+(perfect?10:0))*(bonusMult||1)); // 완료+5, 만점+10, 오답게임 1.5배
    const wrongUniq=[...new Set(wrongIds.current)];
    onFinish({correct:correctCount.current,total,wrong:wrongUniq.length,earned,maxCombo,perfect,
      wrongWords:wrongUniq.map(wordById).filter(Boolean),
      correctIds:[...new Set(correctIds.current)],wrongIds:wrongUniq});
  }
  if(!current)return null;
  if(phase==="countdown")return (
    <main className="relative flex h-[100dvh] flex-col items-center justify-center bg-slate-900 text-white">
      <button onClick={onExit} className="absolute left-4 top-4 text-slate-500 text-lg">✕</button>
      <p className="mb-3 text-slate-400">준비!</p>
      <div key={count} className="animate-pop text-8xl font-black tabular-nums text-yellow-300">{count>0?count:"GO!"}</div>
    </main>
  );
  const timeColor=timeLeft>5?"text-emerald-400":timeLeft>3?"text-amber-400":"text-rose-500";
  return (
    <main className="relative flex h-[100dvh] flex-col overflow-hidden bg-slate-900 px-4 pb-4 pt-3">
      {flash>0&&<div key={flash} className="pointer-events-none absolute inset-0 z-10 animate-flash" style={{background:combo>=6?"rgba(250,204,21,0.4)":combo>=3?"rgba(249,115,22,0.32)":"rgba(16,185,129,0.25)"}}/>}
      <div className="flex items-center gap-3">
        <button onClick={onExit} className="text-slate-500 text-lg">✕</button>
        <div className="h-2 flex-1 overflow-hidden rounded-full bg-slate-700"><div className="h-full rounded-full bg-brand-500 transition-all" style={{width:(index/total*100)+"%"}}/></div>
        <span className="text-sm font-bold text-slate-300">{index+1}/{total}</span>
      </div>
      <div className="mt-2 flex items-center justify-between">
        <span className="rounded-full bg-yellow-400/20 px-3 py-1 text-sm font-bold text-yellow-300">🪙 {points}P</span>
        {combo>=2&&<span className="animate-pop rounded-full bg-orange-500/20 px-3 py-1 text-sm font-extrabold text-orange-400">🔥 {combo} COMBO{combo>=6?" x2":combo>=3?" x1.5":""}</span>}
      </div>
      <div className="mt-1 flex items-baseline justify-center gap-1.5">
        <span className={"text-4xl font-black tabular-nums leading-none "+timeColor+(timeLeft<=3&&phase==="answering"?" animate-pulsefast":"")}>{phase==="answering"?timeLeft:(lastCorrect?"✅":"❌")}</span>
        {phase==="answering"&&<span className="text-xs text-slate-500">초</span>}
      </div>
      <div className={"mt-2 flex flex-col items-center "+(answered&&!lastCorrect?"animate-shake":"")}>
        <div className="mb-1 flex items-center gap-1.5">
          {current.word.exam&&<span className="rounded-full bg-rose-500/25 px-2 py-0.5 text-xs font-bold text-rose-300">🎯 수능기출</span>}
          {current.isReview?<span className="rounded-full bg-orange-500/20 px-2 py-0.5 text-xs font-bold text-orange-300">복습 · 보너스</span>:<span className="text-xs text-slate-500">{current.word.pos}</span>}
        </div>
        <div className="flex items-center gap-2">
          <h2 className="text-4xl font-black tracking-tight text-white">{current.word.term}</h2>
          <button onClick={()=>speak(current.word.term)} className="text-2xl">🔊</button>
        </div>
      </div>
      {answered&&fx&&<div className="pointer-events-none absolute left-1/2 top-[26%] -translate-x-1/2 animate-pop text-center">
        {fx.n>=1&&<div className={"font-black drop-shadow "+(fx.big?"text-5xl":"text-4xl")+" "+(fx.n>=6?"text-yellow-300":fx.n>=3?"text-orange-400":"text-emerald-300")}>🔥 {fx.n} COMBO!</div>}
        {fx.mult&&<div className={"mt-1 font-extrabold "+(fx.n>=6?"text-2xl text-yellow-200 animate-pulsefast":"text-xl text-orange-300")}>{fx.mult}</div>}
      </div>}
      {answered&&gain>0&&<div className="pointer-events-none absolute left-1/2 top-1/3 -translate-x-1/2 animate-floatup text-3xl font-black text-emerald-400">+{gain}P</div>}
      {current.type==="multi"?(
        <React.Fragment>
          <p className="mt-2 text-center text-sm font-semibold text-brand-300">뜻을 <b>모두</b> 고르세요 (정답 {current.correctCount}개)</p>
          <div className="mt-2 flex min-h-0 flex-1 flex-col gap-2">
            {current.options.map((opt,i)=>{const isC=current.correctIdx.includes(i),isP=picked.includes(i);
              let st = answered ? (isC?"bg-emerald-500/90 ring-2 ring-emerald-300 text-white":(isP?"bg-rose-500/90 ring-2 ring-rose-300 text-white":"bg-slate-800 ring-1 ring-slate-700 text-slate-400 opacity-50"))
                                : (isP?"bg-brand-600 ring-2 ring-brand-300 text-white":"bg-slate-800 ring-1 ring-slate-700 text-slate-100");
              return <button key={i} disabled={answered} onClick={()=>toggle(i)} className={"flex flex-1 items-center gap-3 rounded-2xl px-4 text-left text-lg font-bold transition active:scale-95 "+st}>
                <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-black/20 text-sm">{(!answered&&isP)?"✓":i+1}</span>
                <span className="flex-1">{opt}</span>
                {answered&&isC&&<span>⭕</span>}{answered&&!isC&&isP&&<span>❌</span>}
              </button>;})}
          </div>
          <button disabled={answered||picked.length===0} onClick={submitMulti} className="mt-2 w-full rounded-2xl bg-brand-600 py-3 text-base font-bold text-white transition active:scale-95 disabled:bg-slate-700 disabled:text-slate-500">확인 ({picked.length}/{current.correctCount})</button>
        </React.Fragment>
      ):(
        <div className="mt-3 flex min-h-0 flex-1 flex-col gap-2">
          {current.options.map((opt,i)=>{const isA=i===current.answerIndex,isP=i===selected;let st="bg-slate-800 ring-1 ring-slate-700 text-slate-100";if(answered){if(isA)st="bg-emerald-500/90 ring-2 ring-emerald-300 text-white animate-pop";else if(isP)st="bg-rose-500/90 ring-2 ring-rose-300 text-white";else st="bg-slate-800 ring-1 ring-slate-700 text-slate-400 opacity-50";}
            return <button key={i} disabled={answered} onClick={()=>resolve(i)} className={"flex flex-1 items-center gap-3 rounded-2xl px-4 text-left text-lg font-bold transition active:scale-95 "+st}>
              <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-black/20 text-sm">{i+1}</span>
              <span className="flex-1">{opt}</span>
              {answered&&isA&&<span>⭕</span>}{answered&&isP&&!isA&&<span>❌</span>}
            </button>;})}
        </div>
      )}
    </main>
  );
}

  const capped=result.added!=null&&result.added<result.earned;

  return (
    <main className="relative flex h-[100dvh] flex-col items-center gap-3 overflow-y-auto bg-slate-900 px-6 py-8 text-center text-white">
      {result.perfect&&<Confetti/>}
      <div className="animate-pop text-6xl">{result.perfect?"🏆":"🎉"}</div>
      <h1 className="text-2xl font-black">{result.perfect?"올킬! 만점!":"미션 완료!"}</h1>

      <div className="my-1 rounded-3xl bg-brand-600/20 px-10 py-5 ring-1 ring-brand-500/40">
        <p className="text-sm text-slate-400">이번 라운드 획득</p>
        <p className="text-4xl font-black text-yellow-300">+{result.added!=null?result.added:result.earned}P</p>
      </div>
      <p className="text-xs text-slate-500">오늘 적립 {wallet.dailyPoints||0} / {wallet.dailyCap||5000}P {capped?"· 한도로 일부만 적립됨":""}</p>
      {wrong.length>0&&(
        <section className="mt-2 w-full text-left">
          <h2 className="mb-2 text-center text-sm font-bold text-rose-300">📚 틀린 단어 복습 ({wrong.length})</h2>
          <ul className="flex flex-col gap-1.5">
            {wrong.map(w=>(
              <li key={w.id} className="flex items-center justify-between rounded-xl bg-slate-800 px-4 py-2 ring-1 ring-slate-700">
                <span className="flex items-center gap-2"><span className="font-bold">{w.term}</span><button onClick={()=>speak(w.term)} className="text-base">🔊</button></span>
                <span className="text-sm text-slate-300">{w.meaning}</span>
              </li>))}
          </ul>
        </section>
      )}
      <div className="mt-3 flex w-full flex-col gap-2">
        {canContinue?<button onClick={onContinue} className="rounded-2xl bg-emerald-500 py-3 font-bold text-white active:scale-95">▶ 이어서 계속하기</button>
        :<div className="rounded-2xl bg-slate-800 py-3 font-semibold text-slate-400">오늘 적립 한도(5000P)에 도달했어요</div>}
        <button onClick={onDashboard} className="rounded-2xl bg-brand-600 py-3 font-bold text-white active:scale-95">내 기록</button>
        <button onClick={onHome} className="rounded-2xl bg-slate-800 py-3 font-semibold text-slate-200 ring-1 ring-slate-700 active:scale-95">홈으로</button>
      </div>
    </main>
  );
}

function Dashboard({auth,progress,wallet,rank,onHome}){
  const reviewWords=(progress.wrongQueue||[]).map(q=>wordById(q.id)).filter(Boolean).slice(0,30);
  return (
    <main className="flex flex-1 flex-col gap-4 bg-slate-50 p-5">
      <header className="flex items-center gap-3 pt-2"><button onClick={onHome} className="text-slate-400 text-lg">←</button><h1 className="text-xl font-bold">{auth.nickname} 님의 기록</h1></header>
      <section className="grid grid-cols-2 gap-3">
        <Stat label="총 포인트(잔액)" value={wallet.points+"P"} accent="text-brand-600"/>
        <Stat label="누적 포인트" value={(wallet.totalPoints||0)+"P"} accent="text-emerald-600"/>
        <Stat label="최고 콤보" value={"🔥"+(wallet.bestCombo||0)} accent="text-orange-500"/>
        <Stat label="연속 학습" value={progress.streak+"일"} accent="text-purple-600"/>
      </section>
      <RankList rank={rank} me={auth.nickname}/>
      <section>
        <h2 className="mb-2 font-bold">📚 복습할 단어 ({reviewWords.length})</h2>
        {reviewWords.length===0?<p className="rounded-2xl bg-white p-4 text-sm text-slate-400 ring-1 ring-slate-200">틀린 단어가 없어요! 🎉</p>:
        <ul className="flex flex-col gap-2">{reviewWords.map(w=><li key={w.id} className="flex items-center justify-between rounded-2xl bg-white px-4 py-3 shadow-sm ring-1 ring-slate-200"><span className="font-bold">{w.term}</span><span className="text-sm text-slate-500">{w.meaning}</span></li>)}</ul>}
      </section>
    </main>
  );
}

function Progress({progress,onHome}){
  const learned=new Set(progress.learnedIds||[]);
  const rows=GRADES.map(g=>{const pool=wordsForGrade(g.id);const total=pool.length;const done=pool.filter(w=>learned.has(w.id)).length;return {label:g.label,total,done,pct:total?Math.round(done/total*100):0,current:g.id===progress.gradeId};});
  return (
    <main className="flex flex-1 flex-col gap-4 overflow-y-auto bg-slate-50 p-5">
      <header className="flex items-center gap-3 pt-2"><button onClick={onHome} className="text-slate-400 text-lg">←</button><h1 className="text-xl font-bold">학습 진행율</h1></header>
      <section className="rounded-2xl bg-white p-4 text-center shadow-sm ring-1 ring-slate-200">
        <p className="text-sm text-slate-500">지금까지 익힌 단어</p>
        <p className="text-3xl font-extrabold text-emerald-600">{learned.size}개</p>
      </section>
      <p className="text-sm font-semibold text-slate-600">클래스(학년)별 진행율</p>
      <ul className="flex flex-col gap-2">
        {rows.map((r,i)=>(
          <li key={i} className={"rounded-2xl bg-white p-3 shadow-sm ring-1 "+(r.current?"ring-2 ring-brand-400":"ring-slate-200")}>
            <div className="flex items-center justify-between text-sm"><span className="font-bold">{r.label}{r.current?" ⬅ 현재":""}</span><span className="text-slate-500">{r.done}/{r.total} · {r.pct}%</span></div>
            <div className="mt-1.5 h-2.5 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-emerald-500 transition-all" style={{width:r.pct+"%"}}/></div>
          </li>))}
      </ul>
      <p className="text-center text-xs text-slate-400">단어를 정답으로 맞히면 '익힘'으로 기록됩니다.</p>
    </main>
  );
}

/* ─────────────────────────  앱  ───────────────────────── */
function App(){
  const [auth,setAuth]=useState(loadAuth);
  const [progress,setProgress]=useState(()=>auth?loadProgress(auth.username):defaultProgress);
  const [view,setView]=useState("home");
  const [result,setResult]=useState(null);
  const [wallet,setWallet]=useState({points:0,totalPoints:0,bestCombo:0,pending:false,withdrawable:false,threshold:1000,dailyRemaining:5000,dailyCap:5000,dailyPoints:0});
  const [rank,setRank]=useState({topPoints:[],topCombo:[]});
  const [bgmMuted,setBgmMuted]=useState(BGM.muted);
  const [round,setRound]=useState(null);
  const prevPending=useRef(false);

  useEffect(()=>{ if(auth)saveProgress(auth.username,progress); },[auth,progress]);

  // BGM: 퀴즈 화면에서만 재생
  useEffect(()=>{ if(view==="quiz"&&!BGM.muted)bgmStart(); else bgmStop(); return ()=>{}; },[view,bgmMuted]);

  async function refresh(addPoints,combo){
    if(!auth)return null;
    try{
      const res=await callFn("sq-sync",{username:auth.username,token:auth.token,addPoints:addPoints||0,combo:combo||0});
      if(res&&res.error&&/세션/.test(res.error)){doLogout();return null;}
      if(res&&typeof res.points==="number"){
        if(prevPending.current&&!res.pending){alert(res.points===0?"🎉 출금 완료! 포인트가 0으로 초기화되었어요.":"출금 요청이 처리되었습니다.");}
        prevPending.current=res.pending;
        setWallet({points:res.points,totalPoints:res.totalPoints,bestCombo:res.bestCombo,pending:res.pending,withdrawable:res.withdrawable,threshold:res.threshold||1000,dailyRemaining:res.dailyRemaining,dailyCap:res.dailyCap||5000,dailyPoints:res.dailyPoints||0});
        return res;
      }
    }catch(e){}
    return null;
  }
  async function refreshRank(){ setRank(await getRank()); }

  useEffect(()=>{ if(auth){refresh(0,0);refreshRank();} },[auth&&auth.username]);
  useEffect(()=>{ if(!wallet.pending)return; const id=setInterval(()=>refresh(0,0),15000); return ()=>clearInterval(id); },[wallet.pending]);

  function onAuth(a,res,grade){
    saveAuth(a); setAuth(a);
    let had=null; try{had=localStorage.getItem("studyquest:progress:"+a.username);}catch(e){}
    const prog=loadProgress(a.username); if(grade&&!had){prog.gradeId=grade;} saveProgress(a.username,prog); setProgress(prog);
    if(res)setWallet(w=>({...w,points:res.points||0,totalPoints:res.totalPoints||0,bestCombo:res.bestCombo||0,pending:!!res.pending}));
    refresh(0,0); refreshRank(); setView("home");
  }
  function doLogout(){ clearAuth(); setAuth(null); bgmStop(); setView("home"); }

  function gradeIndex(){ const i=GRADES.findIndex(g=>g.id===progress.gradeId); return i<0?0:i; }
  function startQuiz(){
    const lvl=gradeIndex();
    const baseId=GRADES[lvl].id, higherId=GRADES[Math.min(lvl+1,GRADES.length-1)].id;
    const due=(progress.wrongQueue||[]).filter(q=>q.due<=(progress.games||0)).map(q=>q.id);
    const reviewWords=due.map(wordById).filter(Boolean).slice(0,6);
    const reviewSet=new Set(reviewWords.map(w=>w.id));
    const rest=DAILY_NEW_WORDS-reviewWords.length;
    const higherN=lvl<GRADES.length-1?Math.min(progress.mix||0,rest):0;
    const baseN=rest-higherN;
    const basePool=wordsForGrade(baseId).filter(w=>!reviewSet.has(w.id));
    const base=shuffle(basePool).slice(0,baseN);
    const baseIds=new Set(base.map(w=>w.id));
    const higher=shuffle(wordsForGrade(higherId).filter(w=>!reviewSet.has(w.id)&&!baseIds.has(w.id))).slice(0,higherN);
    const ws=shuffle([...reviewWords.map(w=>({word:w,isReview:true})),...base.map(w=>({word:w,isReview:false})),...higher.map(w=>({word:w,isReview:false}))]).slice(0,DAILY_NEW_WORDS);
    setRound({words:ws,pool:wordsForGrade(baseId),bonus:1,wrongGame:false});
    ensureAudio(); setView("quiz");
  }
  function startWrongGame(){
    const ids=(progress.wrongQueue||[]).map(q=>q.id);
    const ws=shuffle(ids).slice(0,DAILY_NEW_WORDS).map(id=>wordById(id)).filter(Boolean).map(w=>({word:w,isReview:true}));
    if(ws.length===0){alert("오답 단어가 없어요! 먼저 미션을 풀어보세요.");return;}
    setRound({words:ws,pool:null,bonus:1.5,wrongGame:true});
    ensureAudio(); setView("quiz");
  }
  async function onFinish(r){
    const wrongGame=round&&round.wrongGame;
    setProgress(p=>{
      const today=todayStr();
      let streak=p.streak,last=p.lastPlayedDate;
      if(last!==today){ streak=(last===yesterdayStr())?p.streak+1:1; last=today; }
      const games=(p.games||0)+1;
      let gradeId=p.gradeId, mix=p.mix||0;
      if(!wrongGame){
        const idx=Math.max(0,GRADES.findIndex(g=>g.id===gradeId));
        if(r.wrong<2){ mix+=2; if(mix>=10){gradeId=GRADES[Math.min(idx+1,GRADES.length-1)].id; mix=0;} }
        else if(r.wrong>=4){ gradeId=GRADES[Math.max(idx-1,0)].id; mix=0; }
      }
      const due=games+2+Math.floor(Math.random()*2); // 2~3게임 뒤 재등장
      const qmap=new Map((p.wrongQueue||[]).map(q=>[q.id,q]));
      const learned=new Set(p.learnedIds||[]);
      (r.correctIds||[]).forEach(id=>{ qmap.delete(id); learned.add(id); });
      (r.wrongIds||[]).forEach(id=>{ qmap.set(id,{id,due}); learned.delete(id); });
      return {...p,streak,lastPlayedDate:last,games,gradeId,mix,wrongQueue:[...qmap.values()],learnedIds:[...learned]};
    });
    const res=await refresh(r.earned,r.maxCombo);
    setResult({...r,added:res?res.added:null,wrongGame});
    refreshRank(); setView("result");
  }
  async function requestWithdraw(){
    try{ const res=await callFn("sq-withdraw",{username:auth.username,token:auth.token});
      if(res&&res.ok){prevPending.current=true;setWallet(w=>({...w,pending:true,withdrawable:false}));alert("출금 요청 완료! 사장님 승인을 기다려 주세요. ⏳");}
      else alert("출금 실패: "+((res&&res.error)||"잠시 후 다시"));
    }catch(e){alert("네트워크 오류");}
  }
  function toggleBgm(){ const m=!bgmMuted; bgmSetMuted(m); setBgmMuted(m); if(!m&&view==="quiz")bgmStart(); ensureAudio(); }

  if(!auth)return <Shell><AuthScreen onAuth={onAuth}/></Shell>;
  const dark=view==="quiz"||view==="result";
  return (
    <Shell dark={dark}>
      {view==="home"&&<Home auth={auth} progress={progress} wallet={wallet} rank={rank} bgmMuted={bgmMuted}
        onStart={startQuiz} onStartWrong={startWrongGame} onWithdraw={requestWithdraw}
        onSelectGrade={(g)=>setProgress(p=>({...p,gradeId:g}))}
        onDashboard={()=>setView("dashboard")} onProgress={()=>setView("progress")} onLogout={doLogout} onToggleBgm={toggleBgm}/>}
      {view==="quiz"&&round&&<Quiz words={round.words} pool={round.pool} bonusMult={round.bonus} scoreMult={1+gradeIndex()*0.1} onExit={()=>setView("home")} onFinish={onFinish}/>}
      {view==="result"&&result&&<Result result={result} wallet={wallet} onContinue={startQuiz} onHome={()=>setView("home")} onDashboard={()=>setView("dashboard")}/>}
      {view==="dashboard"&&<Dashboard auth={auth} progress={progress} wallet={wallet} rank={rank} onHome={()=>setView("home")}/>}
      {view==="progress"&&<Progress progress={progress} onHome={()=>setView("home")}/>}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
