<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>공부 문제지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="lt.css">
<style>
  .names { display: grid; gap: 12px; margin-top: 18px; }
  .names button { border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 18px; font-size: 20px; font-weight: 800; text-align: left;
    display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
  .names button span { font-size: 30px; }
  .face { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--line); }
  .top h1 { display: flex; align-items: center; gap: 10px; }
  .top h1 .face { width: 44px; height: 44px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top h1 { margin: 0; }
  .switch { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
  .sum { margin-top: 14px; }
  .sum .bar { height: 10px; margin-top: 8px; }
  .sum .bar i { background: var(--pass); }
  .sec { font-size: 14px; font-weight: 800; color: var(--muted); margin: 22px 4px 10px; letter-spacing: .02em; }
  .set { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .set + .set { margin-top: 12px; }
  .set.done { border-color: var(--pass); }
  .num { grid-row: span 3; width: 42px; height: 42px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 900; font-size: 18px;
    display: flex; align-items: center; justify-content: center; }
  .set.done .num { background: var(--pass); color: #fff; }
  .set .t { font-weight: 800; font-size: 17px; line-height: 1.35; }
  .set .u { font-size: 13px; color: var(--muted); }
  .set .meta { font-size: 13px; color: var(--ink2); }
  .st { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .chip { font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--ink2); }
  .chip.ok { background: var(--pass-soft); color: var(--pass); }
  .chip.go { background: var(--weak-soft); color: var(--weak); }
  .chip.star { background: #fff4c2; color: #a86b00; }
  .score { font-weight: 900; font-size: 18px; }
  .score small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .acts { margin-left: auto; display: flex; gap: 8px; }
  .lec { grid-column: 1 / -1; margin-top: 8px; padding: 9px 12px; background: var(--brand-soft); border-radius: 10px; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .lec b { color: var(--brand); margin-right: 4px; }
  .retry .btn { white-space: nowrap; flex: none; }
  .retry { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 9px 12px; border-radius: 10px; background: var(--weak-soft); font-size: 14px; }
  .when { display: inline-block; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--brand); }
</style>
</head>
<body>
<div class="wrap" id="app"><div style="padding-top:80px"><div class="spin"></div></div></div>
<script src="lt-common.js"></script>
<script>
(function () {
  // 아이별 문제지. EBS 만점왕 단원 하나에 문제지 하나(lt-api tests/rec_units.ts), 위에서부터 순서대로.
  // 문제지를 더 만들면 여기에 id 를 추가한다(id 는 lt-api tests/*.ts 의 id).
  var MATH_M1 = { id: 'math-m1', when: '11/14(토) 다시 보기 · 아빠가 말하면 풀기' };
  var GEO = { id: 'geo-e', when: '이번 주 · 40분 · 중1 2학기 도형 대비 (아빠가 말하면 풀기)' };
  // 국어·영어·과학 (과목 담당이 만든 문제지). 아직 서버에 없는 id 는 카드가 안 보인다
  var DIAG_WHEN = '이번 주 진단 · 하루 1~2개 · 모르는 건 「잘 모르겠어요」';
  var M1_EXTRA = [
    { label: '📝 진단 테스트 (국어·영어·과학)', items: [{ id: 'kor-m1-diag', when: DIAG_WHEN }, { id: 'eng-m1-diag', when: DIAG_WHEN }, { id: 'sci-gas-diag', when: DIAG_WHEN }] },
    { label: '🔬 과학 · 뉴런 강의 확인 문제', items: [{ id: 'sci-n50' }, { id: 'sci-n54' }, { id: 'sci-gas-unit', when: '58·59강 정리 강의 들은 뒤' }, { id: 'sci-n37' }, { id: 'sci-n38' }, { id: 'sci-n39' }, { id: 'sci-n40' }, { id: 'sci-n41' }] },
    { label: '📖 국어 문제지', items: [{ id: 'kor-m1-grammar' }, { id: 'kor-m1-lit' }, { id: 'kor-m1-read' }] },
    { label: '🔤 영어 문제지', items: [{ id: 'eng-m1-past' }, { id: 'eng-m1-modal' }, { id: 'eng-m1-inf' }, { id: 'eng-m1-comp' }] },
    { label: '🏁 수학 기말 모의고사', items: [{ id: 'm2-final1', when: '중1 2학기 수학 문제지 5개(기본 도형~입체도형) 끝난 뒤 · 60분' }, { id: 'm2-final2', when: '기말고사 1주 전 · 60분' }] },
  ];
  // 다연: 학원날(월·수·금) 국어 10분 세트
  var DAYEON_EXTRA = M1_EXTRA.concat([{ label: '📖 국어 · 학원 가는 날 10분', items: [1, 2, 3, 4].map(function (i) { return { id: 'kor-m1-v5-' + i, when: '월·수·금 10분' }; }) }]);
  var E4_EXTRA = [
    { label: '📝 진단 테스트 (국어·영어)', items: [{ id: 'kor-e4-diag', when: DIAG_WHEN }, { id: 'eng-e4-diag', when: DIAG_WHEN }] },
    { label: '📖 국어 문제지', items: [{ id: 'kor-e4-read' }] },
    { label: '🔤 영어 단어', items: [{ id: 'eng-sq-check', when: '영단어 앱 실력 확인 · 20분' }, { id: 'eng-e4-v1' }] },
  ];
  var STUDENTS = [
    { name: '이다연', emoji: '🐰', sets: ['u-mix', 'u-div', 'g-area', 'g-circle', 'g-solid', 'm-eq-word', 'm2-basic', 'm2-cons', 'm2-poly', 'm2-circ', 'm2-solid', 'u-fdiv', 'u-ddiv', 'u-ratio', 'u-prop'], tests: [GEO, MATH_M1], extra: DAYEON_EXTRA },
    { name: '이다혜', emoji: '🐻', sets: ['u-mix', 'u-div', 'u-red', 'u-red-cmp', 'u-addf', 'g-area', 'g-circle', 'g-solid', 'm-eq-word', 'm2-basic', 'm2-cons', 'm2-poly', 'm2-circ', 'm2-solid', 'u-fdiv', 'u-ddiv', 'u-ratio', 'u-prop'], tests: [GEO, MATH_M1], extra: M1_EXTRA },
    { name: '이다희', emoji: '🐥', setsLabel: '수학 보충 문제지', sets: ['h-frac', 'h-word', 'h-dec', 'h-tri', 'h-quad', 'h-graph', 'h-poly'], tests: [{ id: 'math-e4', when: '아빠가 말하면 풀기 · 45분' }], extra: E4_EXTRA },
  ];
  // 문제지를 풀기 전에 볼 EBS 강의 (EBS 초등 앱에서 교재 이름으로 검색 → 단원 이름 찾기). 단원평가·시험 문제 풀이 강의는 건너뛴다.
  var LECTURES = {
    'u-mix': '「만점왕 수학 5-1」 → 「자연수의 혼합 계산」 01~03강 (04강부터는 안 봐도 돼요)',
    'u-div': '「만점왕 수학 5-1」 → 「약수와 배수」 개념 강의',
    'u-red': '「만점왕 수학 5-1」 → 「약분과 통분」 개념 강의',
    'u-addf': '「만점왕 수학 5-1」 → 「분수의 덧셈과 뺄셈」 개념 강의',
    'u-fdiv': '「만점왕 수학 6-1」 → 「분수의 나눗셈」, 「6-2」 → 「분수의 나눗셈」 개념 강의',
    'u-ddiv': '「만점왕 수학 6-1」 → 「소수의 나눗셈」, 「6-2」 → 「소수의 나눗셈」 개념 강의',
    'u-ratio': '「만점왕 수학 6-1」 → 「비와 비율」 개념 강의',
    'u-prop': '「만점왕 수학 6-2」 → 「비례식과 비례배분」 개념 강의',
    'h-frac': '「만점왕 수학 3-2」 → 「분수」 개념 강의',
    'h-quad': '「만점왕 수학 4-2」 → 「사각형」 개념 강의',
    'h-graph': '「만점왕 수학 4-2」 → 「꺾은선그래프」 개념 강의',
    'h-poly': '「만점왕 수학 4-2」 → 「다각형」 개념 강의',
    'h-tri': '「만점왕 수학 4-2」 → 「삼각형」 개념 강의',
    'h-dec': '「만점왕 수학 4-2」 → 「소수의 덧셈과 뺄셈」 개념 강의',
  };
  // 학교에서 아직 안 배운 단원 — 배운 다음에 풀기
  var WHEN = { 'u-ratio': '기말고사 뒤에 풀어요', 'u-prop': '기말고사 뒤에 풀어요' };
  // 강의 대신 볼 약속
  LECTURES['g-area'] = '「만점왕 수학 5-1」 → 「다각형의 둘레와 넓이」 개념 강의';
  LECTURES['g-circle'] = '「만점왕 수학 6-2」 → 「원의 넓이」 개념 강의';
  LECTURES['u-red-cmp'] = '「만점왕 수학 5-1」 → 「약분과 통분」 분수의 크기 비교 강의';
  LECTURES['sci-gas-unit'] = 'EBS 중학 앱 「뉴런 과학1」 58·59강 (기체의 성질 정리)';
  LECTURES['sci-n37'] = 'EBS 중학 앱 「뉴런 과학1」 37강 (힘의 표현과 평형)';
  LECTURES['sci-n38'] = 'EBS 중학 앱 「뉴런 과학1」 38강 (중력)';
  LECTURES['sci-n39'] = 'EBS 중학 앱 「뉴런 과학1」 39강 (탄성력)';
  LECTURES['sci-n40'] = 'EBS 중학 앱 「뉴런 과학1」 40강 (마찰력)';
  LECTURES['sci-n41'] = 'EBS 중학 앱 「뉴런 과학1」 41강 (부력)';
  LECTURES['eng-m1-modal'] = 'EBS 중학 프리미엄 중1 영어 문법 「조동사」·「미래 시제」 강의';
  LECTURES['m2-solid'] = 'EBS 중학 「뉴런 수학1(하)」 → 「입체도형」(다면체, 회전체, 겉넓이와 부피) 강의';
  LECTURES['m2-circ'] = 'EBS 중학 「뉴런 수학1(하)」 → 「원과 부채꼴」 강의';
  LECTURES['m2-poly'] = 'EBS 중학 「뉴런 수학1(하)」 → 「다각형」(대각선, 내각과 외각) 강의';
  LECTURES['m2-cons'] = 'EBS 중학 「뉴런 수학1(하)」 → 「작도와 합동」 강의';
  LECTURES['m2-basic'] = 'EBS 중학 「뉴런 수학1(하)」 → 「기본 도형」(점·선·면·각, 위치 관계, 평행선) 강의';
  LECTURES['m-eq-word'] = 'EBS 중학 「뉴런 수학1(상)」 → 「문자와 식」, 「일차방정식의 활용」 강의';
  LECTURES['g-solid'] = '「만점왕 수학 6-1」 「각기둥과 각뿔」·「직육면체의 부피와 겉넓이」, 6-2 「원기둥, 원뿔, 구」 개념 강의';
  LECTURES['eng-m1-inf'] = 'EBS 중학 프리미엄 중1 영어 문법 「to부정사」·「동명사」 강의';
  LECTURES['eng-m1-comp'] = 'EBS 중학 프리미엄 중1 영어 문법 「비교급·최상급」 강의';
  LECTURES['eng-m1-past'] = 'EBS 중학 프리미엄 중1 영어 문법 「과거시제」 강의';
  LECTURES['sci-n50'] = 'EBS 중학 앱 「뉴런 과학1」 50강 (기체의 압력과 부피)';
  LECTURES['sci-n54'] = 'EBS 중학 앱 「뉴런 과학1」 54강 (기체의 온도와 부피)';
  var TIPS = { 'kor-m1-grammar': '품사는 「뜻·기능·형태」 세 기준으로 나눠 봐요.', 'kor-m1-lit': '비유·상징·시점·갈등 뜻을 먼저 떠올리고 풀어요.', 'kor-m1-read': '문단마다 중심 문장에 밑줄!', 'kor-e4-read': '질문의 「아닌 것」「남은」「두 번째」에 동그라미!', 'h-word': '강의 없이 바로! 구하는 것에 밑줄 긋고, 답을 고른 뒤 문제를 한 번 더 읽어요.' };
  var PASS = 0.8; // 이 비율 이상 맞히면 ⭐ 통과
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var catalog = null, chatOpened = false;
  var avatars = null, avatarsP = null; // 사진은 저장소가 아니라 서버(lt_avatars)에서 받아 온다. 없으면 이모지
  function loadAvatars() {
    return avatarsP || (avatarsP = LT.api('avatars').then(function (r) { avatars = r.avatars || {}; }).catch(function () { avatars = {}; }));
  }
  function face(s) {
    var src = avatars && avatars[s.name];
    return src && /^data:image\/(jpeg|png|webp);base64,/.test(src) ? '<img class="face" src="' + src + '" alt="">' : '<span>' + s.emoji + '</span>';
  }

  function pickName() {
    document.title = '공부 문제지';
    app.innerHTML = '<div class="card"><h1>📚 공부 문제지</h1><p class="sub">누구인지 골라 주세요</p><div class="names">' +
      STUDENTS.map(function (s, i) { return '<button data-i="' + i + '">' + face(s) + LT.esc(s.name) + '</button>'; }).join('') + '</div></div>';
    var names = app.querySelector('.names');
    names.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      choose(STUDENTS[Number(b.dataset.i)].name);
    };
    // 사진이 나중에 오면 아직 이 화면일 때만 다시 그림
    if (!avatars) loadAvatars().then(function () { if (names.isConnected) pickName(); });
  }
  function choose(name) {
    LT.store('lt.hub.name', name);
    try { history.replaceState(null, '', location.pathname + '?n=' + encodeURIComponent(name)); } catch (e) {}
    load(name);
  }

  function load(name) {
    var s = STUDENTS.find(function (x) { return x.name === name; });
    if (!s) return pickName();
    app.innerHTML = '<div style="padding-top:80px"><div class="spin"></div></div>';
    Promise.all([catalog ? Promise.resolve(catalog) : LT.api('catalog'), LT.api('progress', { student: name }), loadAvatars()]).then(function (r) {
      catalog = r[0];
      render(s, r[1].progress || {});
    }).catch(function (e) {
      app.innerHTML = '<div class="card" style="text-align:center"><div style="font-size:36px">😵</div><p class="sub">' + LT.esc(e.message) +
        '</p><button class="btn" style="margin-top:14px" onclick="location.reload()">다시 시도</button></div>';
    });
  }

  function meta(id) { return catalog.tests.find(function (t) { return t.id === id; }); }
  function link(id, name, fresh) { return 'index.html?test=' + encodeURIComponent(id) + '&n=' + encodeURIComponent(name) + '&hub=1' + (fresh ? '&new=1' : ''); }
  // 틀린 문제 다시 풀기는 설명 → 한 문제씩 바로 채점하는 전용 화면
  function reLink(id, name, fresh) { return 'retry.html?test=' + encodeURIComponent(id) + '&n=' + encodeURIComponent(name) + '&hub=1' + (fresh ? '&new=1' : ''); }
  function hasLocal(id, name) { var a = LT.store('lt.att.' + id + '.' + name); return !!(a && a.attemptId); }

  function card(item, i, name, p) {
    var m = meta(item.id); if (!m) return '';
    var done = p && p.done > 0, going = p && p.inProgress;
    var h = '<div class="set' + (done ? ' done' : '') + '"><div class="num">' + (done ? '✓' : i) + '</div>' +
      '<div class="t">' + LT.esc(m.title) + '</div>' +
      '<div class="u">' + LT.esc(m.subtitle) + '</div>' +
      '<div class="meta">' + m.count + '문항 · ' + m.minutes + '분' + (item.when ? '<br><span class="when">📅 ' + LT.esc(item.when) + '</span>' : '') + '</div>' +
      (LECTURES[item.id] ? '<div class="lec"><b>📺 먼저 볼 강의</b> ' + (/^EBS/.test(LECTURES[item.id]) ? '' : 'EBS 초등 앱에서 ') + LT.esc(LECTURES[item.id]) + '</div>' : '') +
      (TIPS[item.id] ? '<div class="lec"><b>✏️ 약속</b> ' + LT.esc(TIPS[item.id]) + '</div>' : '') + '<div class="st">';
    if (going) {
      h += '<span class="chip go">✏️ 풀고 있어요</span><div class="acts"><a class="btn sm" href="' + link(item.id, name) + '">이어 풀기</a></div>';
    } else if (done) {
      var last = p.last, star = p.best != null && p.total && p.best / p.total >= PASS, re = p.retry;
      h += '<span class="chip ok">✅ 완료</span>' + (star ? '<span class="chip star">⭐ 통과</span>' : '') +
        '<span class="score">' + last.score + '<small> / ' + last.total + '</small></span>' +
        '<span class="chip">' + p.done + '번 풂' + (p.done > 1 ? ' · 최고 ' + p.best : '') + '</span>' +
        (re && !re.inProgress && !re.wrong && re.rounds ? '<span class="chip ok">🔁 틀린 문제 해결</span>' : '') +
        '<div class="acts">' + (hasLocal(item.id, name) ? '<a class="btn ghost sm" href="' + link(item.id, name) + '">결과 보기</a>' : '') +
        '<a class="btn ' + (re && (re.wrong || re.inProgress) ? 'ghost ' : '') + 'sm" href="' + link(item.id, name, true) + '">다시 풀기</a></div>';
      // 틀린 문제가 남아 있으면: 비슷한 문제로 다시 풀기
      if (re && re.inProgress) h += '<div class="retry"><span>🔁 틀린 문제 다시 풀기 하는 중</span><a class="btn sm" href="' + reLink(item.id, name) + '">이어 풀기</a></div>';
      else if (re && re.wrong && re.locked) h += '<div class="retry"><span>🛑 틀린 문제 <b>' + re.wrong + '개</b> — 아빠랑 풀이 보고 내일 다시</span></div>';
      else if (re && re.wrong) h += '<div class="retry"><span>🔁 틀린 문제 <b>' + re.wrong + '개</b> — 설명 보고 다시 풀어요</span><a class="btn sm" href="' + reLink(item.id, name, true) + '">다시 풀기 ▶</a></div>';
    } else {
      h += '<span class="chip">아직 안 풀었어요</span><div class="acts"><a class="btn sm" href="' + link(item.id, name, true) + '">풀기 ▶</a></div>';
    }
    return h + '</div></div>';
  }

  function render(s, progress) {
    document.title = s.name + ' · 공부 문제지';
    var sets = s.sets.map(function (id) { return { id: id, when: WHEN[id] }; });
    var doneN = sets.filter(function (x) { return progress[x.id] && progress[x.id].done > 0; }).length;
    var h = '<div class="card"><div class="top"><h1>' + face(s) + LT.esc(s.name) + '</h1><button class="switch" id="switch">이름 바꾸기</button></div>' +
      (s.sets.length ? '<div class="sum"><b>' + (s.setsLabel || '수학 · 초등 복습 문제지') + ' ' + s.sets.length + '개 중 ' + doneN + '개 완료</b>' + (doneN === s.sets.length ? ' 🎉' : '') +
      '<div class="bar"><i style="width:' + Math.max(3, doneN / s.sets.length * 100) + '%"></i></div></div>' +
      '<p class="muted" style="margin:12px 0 0">위에서부터 하나씩! 그 단원 EBS 강의 먼저 보고 → 문제지 풀기 → 틀린 문제는 풀이 보고 다시. 3일 뒤에 「다시 풀기」로 한 번 더 풀어요.</p>'
      : '<p class="muted" style="margin:12px 0 0">레벨테스트로 어디가 약한지 먼저 알아볼게요. 연습장과 연필 준비하고, 모르는 건 찍지 말고 「잘 모르겠어요」!</p>') + '</div>';
    (s.extra || []).forEach(function (g) {
      var cards = g.items.map(function (x) { return card(x, '✎', s.name, progress[x.id]); }).filter(Boolean);
      if (cards.length) h += '<div class="sec">' + LT.esc(g.label) + '</div>' + cards.join('');
    });
    if (s.sets.length) h += '<div class="sec">' + (s.setsLabel || '수학 · 초등 복습 문제지') + '</div>' + sets.map(function (x, i) { return card(x, i + 1, s.name, progress[x.id]); }).join('');
    if (s.tests.length) h += '<div class="sec">수학 레벨테스트</div>' + s.tests.map(function (x, i) { return card(x, 'T', s.name, progress[x.id]); }).join('');
    app.innerHTML = h;
    LT.coachFab(s.name);
    app.style.paddingBottom = '88px'; // 고정 코치 버튼이 마지막 카드를 가리지 않게
    if (params.get('chat') === '1' && !chatOpened) { chatOpened = true; LT.coachOpen(s.name); } // 결과 화면의 「코치랑 이야기하기」
    document.getElementById('switch').onclick = function () { LT.coachFab(null); app.style.paddingBottom = ''; LT.store('lt.hub.name', null); try { history.replaceState(null, '', location.pathname); } catch (e) {} pickName(); };
  }

  // 문제를 풀고 뒤로 돌아왔을 때 최신 점수로
  window.addEventListener('pageshow', function (e) { if (e.persisted) { var n = params.get('n') || LT.store('lt.hub.name'); if (n) load(n); } });

  var n = (params.get('n') || '').trim() || LT.store('lt.hub.name');
  if (n && STUDENTS.some(function (x) { return x.name === n; })) load(n); else pickName();
})();
</script>
</body>
</html>
